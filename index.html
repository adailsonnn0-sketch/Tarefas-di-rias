<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduDomus Cartoon Premium</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #ff7675;
            --bg: #fdfdfd;
            --white: #ffffff;
            --text: #2d3436;
            --school-color: #74b9ff;
            --home-color: #55efc4;
            --kitchen-color: #fab1a0; 
            --laundry-color: #81ecec; 
            --sweep-color: #ffeaa7;   
            --danger: #ff4757;
            --border-width: 3px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 50px; }

        .screen { padding: 20px; display: none; animation: bounceIn 0.6s ease; }
        .screen.active { display: block; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- CONFIGURAÇÕES --- */
        #settings-btn {
            position: fixed; top: 20px; right: 20px; z-index: 999;
            background: var(--white); border: 3px solid #000; border-radius: 50%;
            width: 50px; height: 50px; font-size: 25px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0 #000;
        }

        #settings-panel {
            position: fixed; top: 0; right: -100%; width: 85%; height: 100%;
            background: var(--white); z-index: 10002; border-left: 5px solid #000;
            padding: 30px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; gap: 20px;
        }

        #settings-panel.open { right: 0; }

        .avatar-grid { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
        .avatar-opt { 
            font-size: 30px; padding: 10px; border: 2px solid transparent; 
            border-radius: 15px; cursor: pointer; 
        }
        .avatar-opt.selected { border-color: var(--primary); background: #eee; }

        /* --- TELAS DE TRAVA E SPLASH --- */
        #initial-trial-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #a29bfe; z-index: 10001;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        .pay-card {
            background: white; border: 4px solid #000; padding: 30px;
            border-radius: 30px; box-shadow: 10px 10px 0px #000;
        }

        #paywall-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 118, 117, 0.95);
            z-index: 20000; display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 30px;
        }

        .premium-tag { 
            background: gold; color: #000; padding: 2px 10px; 
            border-radius: 10px; font-size: 0.7rem; font-weight: 900;
            border: 2px solid #000; vertical-align: middle;
        }

        .input-container {
            background: #a29bfe; padding: 25px; border-radius: 40px;
            border: var(--border-width) solid var(--text);
            display: flex; flex-direction: column; gap: 15px;
            margin-bottom: 25px; box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        }

        input, select {
            padding: 18px; border: var(--border-width) solid var(--text);
            border-radius: 20px; font-weight: bold; background: var(--white);
            font-size: 1rem; outline: none;
        }

        .btn-main, #add-task-btn {
            background: var(--primary); color: white; border: var(--border-width) solid var(--text);
            padding: 18px; border-radius: 25px; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0px 6px 0px #3d348b; text-transform: uppercase;
        }

        .filter-tabs { display: flex; gap: 12px; margin-bottom: 30px; overflow-x: auto; padding: 5px 5px 15px 5px; scrollbar-width: none; }
        .tab-btn {
            flex: 0 0 auto; padding: 12px 20px; border: var(--border-width) solid var(--text);
            border-radius: 18px; background: var(--white); font-weight: 800; text-transform: uppercase; font-size: 0.8rem;
        }
        .tab-btn.active { background: var(--secondary); color: white; box-shadow: 0 4px 0 var(--text); }

        .task-card {
            background: var(--white); padding: 18px; border-radius: 22px;
            border: var(--border-width) solid var(--text); margin-bottom: 15px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 5px 5px 0px var(--text);
        }
        .late { background: #ffebeb; border-color: var(--danger); }
        .task-info { display: flex; align-items: center; gap: 15px; flex: 1; font-weight: bold; }
        .category-dot { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--text); }
        .dot-school { background: var(--school-color); }
        .dot-home { background: var(--home-color); }
        .dot-kitchen { background: var(--kitchen-color); }
        .dot-laundry { background: var(--laundry-color); }
        .dot-sweep { background: var(--sweep-color); }
        .completed { background: #eee !important; opacity: 0.6; }
        .completed span { text-decoration: line-through; }
        .delete-btn { background: var(--secondary); color: white; border: 2px solid var(--text); padding: 8px 12px; border-radius: 10px; font-weight: bold; }

        #alert-popup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--danger); color: white; padding: 15px 25px;
            border-radius: 20px; border: 3px solid #000; font-weight: 900;
            z-index: 1000; display: none; box-shadow: 0 10px 0px #000;
        }
    </style>
</head>
<body>

    <div id="alert-popup">🔔 HORA DA TAREFA!</div>

    <button id="settings-btn" onclick="toggleSettings(); playPop();" style="display: none;">⚙️</button>

    <div id="settings-panel">
        <h2 style="text-align: center;">AJUSTES 🛠️</h2>
        <hr border="1">
        <div>
            <label style="font-weight: 900;">MEU NOME:</label>
            <input type="text" id="user-name-input" placeholder="Seu nome aqui" style="width: 100%; margin-top: 10px;">
        </div>
        <div>
            <label style="font-weight: 900;">AVATAR:</label>
            <div class="avatar-grid">
                <span class="avatar-opt" onclick="selectAvatar('🐱', this); playPop();">🐱</span>
                <span class="avatar-opt" onclick="selectAvatar('🐶', this); playPop();">🐶</span>
                <span class="avatar-opt" onclick="selectAvatar('🦊', this); playPop();">🦊</span>
                <span class="avatar-opt" onclick="selectAvatar('🦄', this); playPop();">🦄</span>
            </div>
        </div>
        <div style="margin-top: auto;">
            <button onclick="saveSettings(); playPop();" class="btn-main" style="width: 100%; background: var(--home-color);">SALVAR</button>
            <button onclick="toggleSettings(); playPop();" class="btn-main" style="width: 100%; background: var(--secondary); margin-top: 10px; font-size: 0.8rem; padding: 10px;">FECHAR</button>
        </div>
    </div>

    <div id="initial-trial-screen">
        <div class="pay-card" style="max-width: 320px;">
            <span style="font-size: 50px;">🎁</span>
            <h2 style="margin: 10px 0;">AVISO PREMIUM</h2>
            <p style="margin-bottom: 20px; font-weight: 800;">Você ganhou <b>3 DIAS</b> de acesso gratuito para testar todas as funções!</p>
            <button onclick="startTrialFlow(); playPop();" class="btn-main" style="width: 100%; background: #55efc4;">INICIAR MEU TESTE</button>
        </div>
    </div>

    <div id="paywall-screen">
        <div class="pay-card">
            <h1 style="font-size: 3rem;">🛑 OPS!</h1>
            <p style="margin: 20px 0; font-weight: 800;">Seu teste grátis de 3 dias acabou.</p>
            <div style="background: #ffeaa7; padding: 15px; border-radius: 15px; border: 3px solid #000; margin-bottom: 20px;">
                <p>Acesso Vitalício por apenas:</p>
                <h2 style="font-size: 2rem;">R$ 2,50</h2>
            </div>
            <button onclick="alert('Redirecionando para pagamento...'); playPop();" class="btn-main" style="background: #55efc4; width: 100%;">PAGAR E LIBERAR AGORA</button>
        </div>
    </div>

    <div id="splash-screen" class="screen" style="background:#ffeaa7; height:100vh; display:none; flex-direction:column; justify-content:center; align-items:center;">
        <div class="logo-container" style="text-align: center;">
            <span style="font-size: 80px;">🚀</span>
            <h1>EduDomus</h1>
        </div>
        <p id="trial-info" style="margin: 20px 0; font-weight: bold; color: #d63031;"></p>
        <button id="btn-start" class="btn-main" style="padding: 15px 60px;" onclick="playPop()">ENTRAR</button>
    </div>

    <div id="main-screen" class="screen">
        <header style="text-align: center; margin: 20px 0;">
            <h2 id="welcome-text"><span id="user-avatar-display">✨</span> MEU DIA <span class="premium-tag">PREMIUM</span></h2>
            <p id="task-count">0 tarefas no radar</p>
            <p id="user-name-display" style="font-size: 0.8rem; margin-top: 5px; color: var(--primary);"></p>
        </header>

        <div class="input-container">
            <input type="text" id="task-input" placeholder="O que vamos fazer?">
            <input type="time" id="task-time" style="width: 100%;">
            <select id="category-select" onchange="playPop()">
                <option value="school">📚 ESCOLA</option>
                <option value="home">🏠 CASA</option>
                <option value="kitchen">🍳 COZINHA</option>
                <option value="laundry">🧺 LAVAR ROUPA</option>
                <option value="sweep">🧹 VARRER</option>
            </select>
            <button id="add-task-btn" onclick="playPop()">ADICIONAR +</button>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">TODAS <span class="count"></span></button>
            <button class="tab-btn" data-filter="school">ESCOLA <span class="count"></span></button>
            <button class="tab-btn" data-filter="home">CASA <span class="count"></span></button>
            <button class="tab-btn" data-filter="kitchen">COZINHA <span class="count"></span></button>
            <button class="tab-btn" data-filter="laundry">LAVAR <span class="count"></span></button>
            <button class="tab-btn" data-filter="sweep">VARRER <span class="count"></span></button>
        </div>

        <div id="task-list"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPop() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playDing() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        const TRIAL_DAYS = 3;
        let installDate = localStorage.getItem('eduDomus_install_date');
        let selectedAvatar = localStorage.getItem('eduDomus_avatar') || '✨';

        if (!installDate) {
            installDate = new Date().getTime();
            localStorage.setItem('eduDomus_install_date', installDate);
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('open');
        }

        function selectAvatar(icon, el) {
            selectedAvatar = icon;
            document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        function saveSettings() {
            const name = document.getElementById('user-name-input').value;
            localStorage.setItem('eduDomus_user_name', name);
            localStorage.setItem('eduDomus_avatar', selectedAvatar);
            applySettings();
            toggleSettings();
        }

        function applySettings() {
            const name = localStorage.getItem('eduDomus_user_name') || '';
            const avatar = localStorage.getItem('eduDomus_avatar') || '✨';
            document.getElementById('user-name-display').innerText = name ? `Olá, ${name}!` : '';
            document.getElementById('user-avatar-display').innerText = avatar;
            document.getElementById('user-name-input').value = name;
        }

        function initApp() {
            const now = new Date().getTime();
            const diffInDays = (now - installDate) / (1000 * 3600 * 24);
            const daysLeft = Math.ceil(TRIAL_DAYS - diffInDays);
            applySettings();
            if (diffInDays >= TRIAL_DAYS) {
                document.getElementById('paywall-screen').style.display = 'flex';
            } else {
                document.getElementById('initial-trial-screen').style.display = 'flex';
                document.getElementById('trial-info').innerText = `Você tem ${daysLeft} ${daysLeft > 1 ? 'dias' : 'dia'} de teste grátis!`;
            }
        }

        function startTrialFlow() {
            document.getElementById('initial-trial-screen').style.display = 'none';
            document.getElementById('splash-screen').style.display = 'flex';
            document.getElementById('splash-screen').classList.add('active');
        }

        initApp();

        let tasks = JSON.parse(localStorage.getItem('eduDomus_v_final')) || [];
        const splash = document.getElementById('splash-screen');
        const main = document.getElementById('main-screen');
        const btnStart = document.getElementById('btn-start');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskInput = document.getElementById('task-input');
        const taskTime = document.getElementById('task-time');
        const categorySelect = document.getElementById('category-select');
        const taskList = document.getElementById('task-list');
        const taskCountText = document.getElementById('task-count');

        btnStart.onclick = () => {
            playPop();
            splash.style.display = 'none';
            main.classList.add('active');
            document.getElementById('settings-btn').style.display = 'flex';
            render();
        };

        addTaskBtn.onclick = () => {
            playPop();
            const text = taskInput.value.trim();
            if (text === "") return;
            tasks.push({
                id: Date.now(),
                text: text,
                time: taskTime.value,
                category: categorySelect.value,
                completed: false
            });
            taskInput.value = "";
            taskTime.value = "";
            render(document.querySelector('.tab-btn.active').dataset.filter);
        };

        window.deleteTask = (id) => {
            playPop();
            tasks = tasks.filter(t => t.id !== id);
            render(document.querySelector('.tab-btn.active').dataset.filter);
        };

        window.toggleTask = (id) => {
            const task = tasks.find(t => t.id === id);
            if(task && !task.completed) playDing();
            else playPop();
            
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            render(document.querySelector('.tab-btn.active').dataset.filter);
        };

        function render(filter = 'all') {
            taskList.innerHTML = '';
            const now = new Date();
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // ATUALIZA NÚMEROS NOS BOTÕES
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const btnFilter = btn.dataset.filter;
                const count = btnFilter === 'all' ? tasks.length : tasks.filter(t => t.category === btnFilter).length;
                btn.querySelector('.count').innerText = `(${count})`;
            });

            const filtered = filter === 'all' ? tasks : tasks.filter(t => t.category === filter);

            filtered.forEach(task => {
                const isLate = task.time && task.time < currentTime && !task.completed;
                const div = document.createElement('div');
                div.className = `task-card ${task.completed ? 'completed' : ''} ${isLate ? 'late' : ''}`;
                div.innerHTML = `
                    <div class="task-info" onclick="toggleTask(${task.id})">
                        <div class="category-dot dot-${task.category}"></div>
                        <div>
                            <span>${task.text}</span>
                            ${task.time ? `<br><small style="color:#666">⏰ ${task.time}</small>` : ''}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">X</button>
                `;
                taskList.appendChild(div);
            });
            taskCountText.innerText = `${tasks.length} tarefas`;
            localStorage.setItem('eduDomus_v_final', JSON.stringify(tasks));
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playPop();
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render(btn.dataset.filter);
            });
        });
    </script>
</body>
</html>
